# Settings for App Hosting
# Docs: https://firebase.google.com/docs/app-hosting/configure
# Reference: https://firebase.google.com/docs/reference/app-hosting/yaml

# Specifies the Next.js framework.
framework: nextjs

# Controls the minimum and maximum number of instances.
runConfig:
  minInstances: 0 # Default is 0, scale to zero
  # maxInstances: 100 # Default is 100, uncomment to set a specific limit

